spring:
  application:
    name: stock-service
  config:
    import: "optional:configserver:http://localhost:8088"
  threads:
    virtual:
      enabled: true
  datasource:
    # URI JDBC centralizada (moderna e recomendada)
    url: jdbc:mysql://localhost:3306/stockdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
