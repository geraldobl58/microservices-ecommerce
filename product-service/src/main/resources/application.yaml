spring:
  application:
    name: product-service
  config:
    import: "optional:configserver:http://localhost:8088"
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: mongodb://root:password@localhost:27017/product-db?authSource=admin

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
